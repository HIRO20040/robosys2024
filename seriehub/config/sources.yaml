# 情報源の定義。
#
# tier は「報道の一次性」を表し、移籍情報の確度判定に直接使われます。
#   official   … リーグ/クラブの公式発表。これ以上の一次情報は無い。
#   primary    … 自前の記者を抱え、独自取材で一次情報を出す媒体（イタリア主要紙・通信社）。
#   aggregator … 他媒体の報道をまとめ直す媒体。速いが伝聞。
#   translated … 上記を翻訳・要約した日本語媒体。二次以上の伝聞。
#
# lang は原文の言語。ja 以外は翻訳パイプラインの対象になります。
# enabled: false にすると収集対象から外れます（URL が死んだ時の緊急停止用）。
#
# 注意: RSS の URL は媒体側の都合で予告なく変わります。
#       `python3 build.py --check-feeds` で全フィードの死活を確認できます。
#       落ちているフィードがあってもビルドは止まらず、当該ソースを飛ばして続行します。

